{% extends "base.html" %}
{% block content %}
<h2>بازیابی رمز عبور</h2>
<p>ایمیل خود را وارد کنید تا لینک بازنشانی برایتان ارسال شود:</p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">ارسال لینک</button>
</form>
<p><a href="{% url 'accounts:login' %}">بازگشت به ورود</a></p>
{% endblock %}
