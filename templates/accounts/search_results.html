{% extends "base.html" %}

{% block content %}
<h2>نتایج جستجو برای "{{ query }}"</h2>

{% if posts %}
  <ul>
    {% for post in posts %}
      <li>
        <a href="{% url 'accounts:post_detail' post.id %}">{{ post.title }}</a>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p>هیچ پستی یافت نشد.</p>
{% endif %}
{% endblock %}
