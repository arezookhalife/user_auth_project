<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}حساب کاربری{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    {% if messages %}
        <ul>
        {% for m in messages %}
            <li>{{ m }}</li>
        {% endfor %}
        </ul>
    {% endif %}

    <nav>
        <a href="{% url 'accounts:home' %}">خانه</a>  |
        {% if user.is_authenticated %}
            <a href="{% url 'accounts:profile' %}">پروفایل</a> |
            <a href="{% url 'accounts:logout' %}">خروج</a>
        {% else %}
            <a href="{% url 'accounts:register' %}">ثبت‌نام</a> |
            <a href="{% url 'accounts:login' %}">ورود</a>
        {% endif %}
        <form method="get" action="{% url 'accounts:search_posts' %}">
            <input type="text" name="q" placeholder="جستجو...">
            <button type="submit">جستجو</button>
        </form>
    </nav>

    <hr>
    {% block content %}{% endblock %}
</body>
</html>
